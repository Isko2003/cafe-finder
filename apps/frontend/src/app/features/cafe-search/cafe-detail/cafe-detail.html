@if (cafe(); as c) {
  <div
    class="pointer-events-auto w-full max-w-sm rounded-2xl border border-line bg-paper-soft/95 p-5 shadow-xl shadow-ink/15 backdrop-blur"
  >
    <div class="flex items-start justify-between gap-3">
      <h2 class="font-display text-lg font-semibold leading-snug text-ink">{{ c.name }}</h2>
      <button
        type="button"
        class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full border border-line text-ink-soft transition-colors hover:border-copper hover:text-copper-deep"
        aria-label="Paneli bağla"
        (click)="close()"
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path
            d="M1.5 1.5l11 11M12.5 1.5l-11 11"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>

    <p class="mt-1.5 font-body text-sm text-ink-soft">{{ c.address }}</p>

    <div class="mt-4 flex flex-col gap-3 border-t border-line pt-4">
      <div class="flex items-start gap-2.5">
        <span class="mt-0.5 font-body text-sm text-copper-deep">🕒</span>
        <div class="font-body text-sm text-ink">
          @if (openingHoursLines().length > 0) {
            @for (line of openingHoursLines(); track line) {
              <p>{{ line }}</p>
            }
          } @else {
            <p class="text-ink-soft">İş saatları məlum deyil</p>
          }
        </div>
      </div>

      @if (c.phone) {
        <div class="flex items-center gap-2.5">
          <span class="font-body text-sm text-copper-deep">📞</span>
          <a href="tel:{{ c.phone }}" class="font-body text-sm text-ink hover:text-copper-deep">{{
            c.phone
          }}</a>
        </div>
      }

      @if (c.website) {
        <div class="flex items-center gap-2.5">
          <span class="font-body text-sm text-copper-deep">🔗</span>
          <a
            [href]="c.website"
            target="_blank"
            rel="noopener"
            class="truncate font-body text-sm font-semibold text-copper-deep hover:underline"
          >
            {{ c.website }}
          </a>
        </div>
      }
    </div>
  </div>
}
